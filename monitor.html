<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-deep: #060a14;
            --bg-light: #0c1a30;
            --card-bg: rgba(12, 26, 48, 0.55);
            --card-border: rgba(80, 180, 255, 0.14);
            --accent-cyan: #38bdf8;
            --accent-blue: #6366f1;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --success: #34d399;
            --text-primary: #e6f2ff;
            --text-secondary: #7d9ab8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 12% 15%, rgba(56, 189, 248, 0.14), transparent 45%),
                radial-gradient(circle at 88% 85%, rgba(99, 102, 241, 0.12), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(12, 26, 48, 0.9), var(--bg-deep) 80%);
            z-index: -1;
            animation: bgShift 24s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.12) translate(-2%, -1%); }
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 16px 48px;
            position: relative;
            z-index: 1;
        }

        /* ============ HEADER ============ */
        .header {
            text-align: center;
            padding: 8px 0 26px;
            animation: fadeInDown 0.5s ease-out;
        }

        .header-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 32px var(--accent-glow);
            animation: pulseGlow 3.2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 28px var(--accent-glow); }
            50%      { box-shadow: 0 8px 44px rgba(56, 189, 248, 0.55); }
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.4px;
        }

        .header p {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        /* ============ STATS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 12px 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.3s;
            animation: fadeInUp 0.55s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.10s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card:nth-child(4) { animation-delay: 0.20s; }

        .stat-card::before {
            content: '';
            position: absolute; top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.5;
        }

        .stat-card:hover {
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 12px 36px var(--accent-glow);
            border-color: rgba(56, 189, 248, 0.35);
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -0.8px;
        }

        .stat-card .label {
            font-size: 10.5px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* ============ CARDS ============ */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 16px 14px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
            animation-delay: 0.25s;
        }

        .card::before {
            content: '';
            position: absolute; top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.4;
        }

        .card h3 {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }

        .card h3::before {
            content: '';
            width: 3px;
            height: 14px;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* ============ LIST ============ */
        .list-item {
            display: flex;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(80, 180, 255, 0.07);
            font-size: 13.5px;
            transition: all 0.2s;
        }

        .list-item:last-child { border-bottom: none; }

        .list-item:hover {
            padding-left: 6px;
            background: rgba(56, 189, 248, 0.04);
            border-radius: 8px;
        }

        .list-item .rank {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-deep);
            font-size: 10.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .list-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
            font-weight: 500;
        }

        .list-item .count {
            font-weight: 800;
            color: var(--accent-cyan);
            margin-left: 12px;
            font-size: 14px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* ============ LOADING ============ */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 13.5px;
            font-weight: 500;
        }

        .loading::before {
            content: '';
            display: block;
            width: 38px;
            height: 38px;
            margin: 0 auto 16px;
            border: 3px solid rgba(56, 189, 248, 0.15);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 18px var(--accent-glow);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============ ANIMATIONS ============ */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============ CHART ============ */
        .chart-wrapper {
            position: relative;
            height: 210px;
            width: 100%;
        }

        /* ============ SCROLLBAR ============ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 3px;
        }

        /* ============ MOBILE ============ */
        @media (max-width: 360px) {
            .stat-card .value { font-size: 22px; }
            .header h1 { font-size: 19px; }
            .container { padding: 20px 14px 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">📊</div>
            <h1>myGov Monitor</h1>
            <p>Статистика за последние 7 дней</p>
        </div>

        <div id="loading" class="loading">Загрузка данных...</div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="total-clicks">0</div>
                    <div class="label">👆 Кликов</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="total-views">0</div>
                    <div class="label">👁 Просмотров</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="unique-users">0</div>
                    <div class="label">👤 Уникальных</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="total-forms">0</div>
                    <div class="label">📝 Отправок</div>
                </div>
            </div>

            <div class="card">
                <h3>Динамика за неделю</h3>
                <div class="chart-wrapper">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>Топ страниц</h3>
                <div id="top-pages"></div>
            </div>

            <div class="card">
                <h3>Топ кликов</h3>
                <div id="top-clicks"></div>
            </div>

            <div class="card">
                <h3>Топ полей ввода</h3>
                <div id="top-inputs"></div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* Если бэкенд на другом домене — впиши полный URL.
           Если тот же Flask-сервер — оставь пусто. */
        const API_BASE = '';

        const COLORS = {
            cyan: '#38bdf8',
            blue: '#6366f1',
            green: '#34d399',
            grid: 'rgba(80, 180, 255, 0.07)',
            text: '#7d9ab8'
        };

        async function loadStats() {
            try {
                const [summaryRes, dailyRes] = await Promise.all([
                    fetch(API_BASE + '/api/stats/summary'),
                    fetch(API_BASE + '/api/stats/daily')
                ]);

                const summary = await summaryRes.json();
                const daily   = await dailyRes.json();

                animateNumber('total-clicks', summary.total_clicks || 0);
                animateNumber('total-views',  summary.total_views  || 0);
                animateNumber('unique-users', summary.unique_users || 0);
                animateNumber('total-forms',  summary.total_forms  || 0);

                renderList('top-pages',  summary.top_pages,  'page');
                renderList('top-clicks', summary.top_clicks, 'element');
                renderList('top-inputs', summary.top_inputs, 'element');

                renderChart(daily);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (e) {
                console.error('load error', e);
                document.getElementById('loading').textContent = '⚠️ Ошибка загрузки данных';
            }
        }

        function animateNumber(id, target) {
            const el = document.getElementById(id);
            const duration = 800;
            const start = performance.now();
            function update(now) {
                const p = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - p, 3);
                const current = Math.floor(eased * target);
                el.textContent = current.toLocaleString('ru-RU');
                if (p < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        function renderList(id, items, nameKey) {
            const c = document.getElementById(id);
            if (!items || items.length === 0) {
                c.innerHTML = '<div class="list-item"><span class="name">Нет данных</span></div>';
                return;
            }
            c.innerHTML = items.map((it, i) => `
                <div class="list-item">
                    <div class="rank">${i + 1}</div>
                    <span class="name">${escapeHtml(it[nameKey] || 'Неизвестно')}</span>
                    <span class="count">${it.count}</span>
                </div>
            `).join('');
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function renderChart(daily) {
            const ctx = document.getElementById('dailyChart').getContext('2d');

            const labels = daily.daily_views.map(d => {
                const dt = new Date(d.date);
                return dt.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            });

            const viewsData  = daily.daily_views.map(d => d.count);
            const clicksData = daily.daily_clicks.map(d => d.count);
            const formsData  = daily.daily_forms.map(d => d.count);

            const gViews = ctx.createLinearGradient(0, 0, 0, 210);
            gViews.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
            gViews.addColorStop(1, 'rgba(56, 189, 248, 0)');

            const gClicks = ctx.createLinearGradient(0, 0, 0, 210);
            gClicks.addColorStop(0, 'rgba(99, 102, 241, 0.35)');
            gClicks.addColorStop(1, 'rgba(99, 102, 241, 0)');

            const gForms = ctx.createLinearGradient(0, 0, 0, 210);
            gForms.addColorStop(0, 'rgba(52, 211, 153, 0.32)');
            gForms.addColorStop(1, 'rgba(52, 211, 153, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Просмотры',
                            data: viewsData,
                            borderColor: COLORS.cyan,
                            backgroundColor: gViews,
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: COLORS.cyan,
                            pointBorderColor: '#060a14',
                            pointBorderWidth: 2,
                            pointRadius: 3.5, pointHoverRadius: 6
                        },
                        {
                            label: 'Клики',
                            data: clicksData,
                            borderColor: COLORS.blue,
                            backgroundColor: gClicks,
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: COLORS.blue,
                            pointBorderColor: '#060a14',
                            pointBorderWidth: 2,
                            pointRadius: 3.5, pointHoverRadius: 6
                        },
                        {
                            label: 'Отправки',
                            data: formsData,
                            borderColor: COLORS.green,
                            backgroundColor: gForms,
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: COLORS.green,
                            pointBorderColor: '#060a14',
                            pointBorderWidth: 2,
                            pointRadius: 3.5, pointHoverRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: COLORS.text,
                                padding: 14,
                                font: { size: 11.5, weight: '600' },
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(6, 10, 20, 0.95)',
                            borderColor: COLORS.cyan,
                            borderWidth: 1,
                            titleColor: '#fff',
                            bodyColor: COLORS.cyan,
                            padding: 10,
                            cornerRadius: 8
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: COLORS.text, font: { size: 11 }, padding: 6 },
                            grid: { color: COLORS.grid, drawBorder: false }
                        },
                        x: {
                            ticks: { color: COLORS.text, font: { size: 11 }, padding: 6 },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        loadStats();
    })();
    </script>
</body>
</html>
