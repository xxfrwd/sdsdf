<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Monitor — Global</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0f1115; color: #e6e6e6;
            min-height: 100vh; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 880px; }
        h1 {
            font-size: 28px; font-weight: 600; margin-bottom: 8px;
            background: linear-gradient(90deg, #4ade80, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 14px; color: #8a8f98; margin-bottom: 32px; }
        .counter-card {
            background: linear-gradient(135deg, #1a1f2e 0%, #151922 100%);
            border: 1px solid #232836; border-radius: 14px;
            padding: 36px 40px; margin-bottom: 24px;
            position: relative; overflow: hidden;
        }
        .counter-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px; background: linear-gradient(90deg, #4ade80, #38bdf8, #a78bfa);
        }
        .counter-label {
            font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
            color: #6b7280; margin-bottom: 12px; font-weight: 600;
        }
        .counter-value {
            font-size: 96px; font-weight: 800; line-height: 1; color: #fff;
            font-variant-numeric: tabular-nums; letter-spacing: -4px;
            text-shadow: 0 0 40px rgba(74, 222, 128, 0.35);
        }
        .counter-meta {
            margin-top: 16px; display: flex; gap: 24px;
            flex-wrap: wrap; font-size: 13px; color: #8a8f98;
        }
        .counter-meta b { color: #c4c8cf; }
        .status { display: inline-flex; align-items: center; gap: 8px;
                  font-size: 12px; color: #8a8f98; margin-left: auto; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%;
                      background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        .status-dot.err { background: #f87171; box-shadow: 0 0 8px #f87171; }
        .header-row { display: flex; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
        .header-row .titles { flex: 1; min-width: 200px; }
        .actions { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        button {
            font-family: inherit; font-size: 14px; font-weight: 600;
            padding: 12px 20px; border-radius: 8px; border: 1px solid #2a3140;
            background: #1a1f2e; color: #e6e6e6; cursor: pointer;
        }
        button:hover { background: #232836; }
        .panel { background: #151922; border: 1px solid #232836;
                 border-radius: 12px; padding: 24px 28px; margin-bottom: 20px; }
        .panel-title { font-size: 13px; text-transform: uppercase;
                       letter-spacing: 1.6px; color: #6b7280;
                       margin-bottom: 18px; font-weight: 600; }
        .bar-row { display: flex; align-items: center; gap: 12px;
                   font-size: 13px; margin-bottom: 10px; }
        .bar-label { width: 110px; color: #8a8f98;
                     font-family: monospace; font-size: 12px; }
        .bar-track { flex: 1; height: 8px; background: #0f1115;
                     border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #4ade80, #38bdf8);
                    border-radius: 4px; transition: width 0.3s; }
        .bar-value { width: 60px; text-align: right; color: #c4c8cf; font-weight: 600; }
        .log { max-height: 400px; overflow-y: auto;
               font-family: monospace; font-size: 12.5px; }
        .log-entry { padding: 8px 12px; border-radius: 6px; margin-bottom: 4px;
                     background: #0f1115; border-left: 3px solid #38bdf8;
                     display: flex; gap: 10px; }
        .log-idx { color: #6b7280; min-width: 50px; }
        .log-tag { color: #4ade80; font-weight: 600; }
        .log-body { color: #c4c8cf; flex: 1; }
        .log-time { color: #6b7280; font-size: 11px; }
        .empty { text-align: center; padding: 30px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <div class="titles">
                <h1>🖱 Click Monitor</h1>
                <div class="subtitle">Global stats · AUS LOG 🇦🇺🌏</div>
            </div>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting…</span>
            </div>
        </div>

        <div class="counter-card">
            <div class="counter-label">Total clicks (all-time, all browsers)</div>
            <div class="counter-value" id="totalValue">0</div>
            <div class="counter-meta">
                <span>Sessions: <b id="sessionsCount">0</b></span>
                <span>Submits: <b id="submitsCount">0</b></span>
                <span>Last event: <b id="lastEvent">—</b></span>
            </div>
        </div>

        <div class="actions">
            <button id="refreshBtn">🔄 Refresh</button>
        </div>

        <div class="panel">
            <div class="panel-title">Clicks by session</div>
            <div id="sessionBars"><div class="empty">No sessions yet</div></div>
        </div>

        <div class="panel">
            <div class="panel-title">Top clicked elements</div>
            <div id="elementBars"><div class="empty">No elements yet</div></div>
        </div>

        <div class="panel">
            <div class="panel-title">Recent events (last 50)</div>
            <div class="log" id="logList"><div class="empty">No events yet</div></div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const API_STATS = '/api/stats';
        const TOP_SHOW = 8;
        const LOG_SHOW = 50;

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function fmtTime(iso) {
            if (!iso) return '—';
            try { return new Date(iso).toLocaleString('en-GB'); } catch (e) { return iso; }
        }
        function topEntries(obj, limit) {
            return Object.entries(obj || {}).sort((a,b) => b[1]-a[1]).slice(0, limit);
        }

        async function fetchStats() {
            try {
                const res = await fetch(API_STATS, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                document.getElementById('statusDot').classList.remove('err');
                document.getElementById('statusText').textContent = 'Connected';
                return data;
            } catch (e) {
                document.getElementById('statusDot').classList.add('err');
                document.getElementById('statusText').textContent = 'Disconnected';
                return null;
            }
        }

        function render(data) {
            if (!data) return;
            document.getElementById('totalValue').textContent = data.total || 0;
            document.getElementById('sessionsCount').textContent = Object.keys(data.sessions || {}).length;
            document.getElementById('submitsCount').textContent = data.submits || 0;
            document.getElementById('lastEvent').textContent = fmtTime(data.lastSeen);

            const sessionBars = document.getElementById('sessionBars');
            const sessionTop = topEntries(data.sessions, TOP_SHOW);
            if (sessionTop.length) {
                const max = Math.max(...sessionTop.map(x => x[1]));
                sessionBars.innerHTML = sessionTop.map(([sid, count]) => `
                    <div class="bar-row">
                        <div class="bar-label">${esc(sid)}</div>
                        <div class="bar-track"><div class="bar-fill" style="width:${max ? (count/max)*100 : 0}%"></div></div>
                        <div class="bar-value">${count}</div>
                    </div>`).join('');
            }

            const elementBars = document.getElementById('elementBars');
            const elementTop = topEntries(data.elements, TOP_SHOW);
            if (elementTop.length) {
                const max = Math.max(...elementTop.map(x => x[1]));
                elementBars.innerHTML = elementTop.map(([sel, count]) => {
                    const short = sel.length > 20 ? sel.slice(0,20)+'…' : sel;
                    return `<div class="bar-row">
                        <div class="bar-label" title="${esc(sel)}">${esc(short)}</div>
                        <div class="bar-track"><div class="bar-fill" style="width:${max ? (count/max)*100 : 0}%"></div></div>
                        <div class="bar-value">${count}</div>
                    </div>`;
                }).join('');
            }

            const logList = document.getElementById('logList');
            const logItems = (data.log || []).slice(-LOG_SHOW).reverse();
            if (logItems.length) {
                logList.innerHTML = logItems.map(e => `
                    <div class="log-entry">
                        <span class="log-idx">#${e.allTime || '?'}</span>
                        <span class="log-tag">${esc(e.tag)}</span>
                        <span class="log-body">${esc(e.descr)}</span>
                    </div>`).join('');
            }
        }

        async function tick() {
            const data = await fetchStats();
            render(data);
        }

        document.getElementById('refreshBtn').addEventListener('click', tick);

        tick();
        setInterval(tick, 5000);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') tick();
        });
    })();
    </script>
</body>
</html>
