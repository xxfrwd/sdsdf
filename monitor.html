<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Monitor</title></head>
<body style="font-family:sans-serif;padding:40px;background:#0f1115;color:#fff">
  <h1>🖱 Global Clicks</h1>
  <div id="total" style="font-size:96px;font-weight:800">0</div>
  <div id="status">Connecting...</div>
  <script>
    async function tick() {
      try {
        const r = await fetch('/api/stats');
        const d = await r.json();
        document.getElementById('total').textContent = d.total || 0;
        document.getElementById('status').textContent = 'Connected · updates every 5s';
      } catch (e) {
        document.getElementById('status').textContent = 'Disconnected';
      }
    }
    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
