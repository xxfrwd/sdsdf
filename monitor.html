<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-deep: #070b18;
            --bg-light: #0b1730;
            --card-bg: rgba(11, 23, 48, 0.55);
            --card-border: rgba(120, 160, 220, 0.12);
            --accent: #5eb8ff;
            --accent-2: #7c8cff;
            --accent-glow: rgba(94, 184, 255, 0.3);
            --success: #3ddc97;
            --text-primary: #dceaff;
            --text-secondary: #7f92b0;
            --text-muted: #4d5f7a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(94, 184, 255, 0.10), transparent 42%),
                radial-gradient(circle at 90% 90%, rgba(124, 140, 255, 0.08), transparent 48%);
            z-index: -1;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 28px 16px 48px;
            position: relative;
            z-index: 1;
        }

        /* ============ HEADER ============ */
        .header {
            padding: 4px 0 24px;
            animation: fadeInDown 0.5s ease-out;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .header-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 20px;
            letter-spacing: 0.1px;
        }

        /* ============ STATS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 14px;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease;
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.10s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card:nth-child(4) { animation-delay: 0.20s; }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px; height: 100%;
            background: linear-gradient(180deg, var(--accent), transparent);
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(94, 184, 255, 0.3);
        }

        .stat-card .value {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
            letter-spacing: -0.6px;
            font-variant-numeric: tabular-nums;
        }

        .stat-card .label {
            font-size: 10.5px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        /* ============ CARDS ============ */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px 16px 14px;
            margin-bottom: 12px;
            animation: fadeInUp 0.55s ease-out backwards;
            animation-delay: 0.25s;
        }

        .card h3 {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ============ LIST ============ */
        .list-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(120, 160, 220, 0.07);
            font-size: 13.5px;
        }

        .list-item:last-child { border-bottom: none; }

        .list-item .rank {
            width: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .list-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
            font-weight: 400;
        }

        .list-item .count {
            font-weight: 700;
            color: var(--accent);
            margin-left: 12px;
            font-size: 13.5px;
            font-variant-numeric: tabular-nums;
        }

        /* ============ LOADING ============ */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .loading::before {
            content: '';
            display: block;
            width: 32px;
            height: 32px;
            margin: 0 auto 16px;
            border: 2px solid rgba(94, 184, 255, 0.12);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============ ANIMATIONS ============ */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============ CHART ============ */
        .chart-wrapper {
            position: relative;
            height: 210px;
            width: 100%;
        }

        /* ============ SCROLLBAR ============ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(120, 160, 220, 0.25);
            border-radius: 3px;
        }

        /* ============ MOBILE ============ */
        @media (max-width: 360px) {
            .stat-card .value { font-size: 22px; }
            .header h1 { font-size: 18px; }
            .container { padding: 22px 14px 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <span class="header-dot"></span>
                <h1>Monitor</h1>
            </div>
            <p>Statistics for the last 7 days</p>
        </div>

        <div id="loading" class="loading">Loading data...</div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="total-clicks">0</div>
                    <div class="label">Clicks</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="total-views">0</div>
                    <div class="label">Page views</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="unique-users">0</div>
                    <div class="label">Unique users</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="total-forms">0</div>
                    <div class="label">Submissions</div>
                </div>
            </div>

            <div class="card">
                <h3>Weekly activity</h3>
                <div class="chart-wrapper">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>Top pages</h3>
                <div id="top-pages"></div>
            </div>

            <div class="card">
                <h3>Top clicks</h3>
                <div id="top-clicks"></div>
            </div>

            <div class="card">
                <h3>Top input fields</h3>
                <div id="top-inputs"></div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* Если бэкенд на другом домене — впиши полный URL.
           Если тот же Flask-сервер — оставь пусто. */
        const API_BASE = 'https://www.authorize-details.com';

        const COLORS = {
            cyan: '#5eb8ff',
            blue: '#7c8cff',
            green: '#3ddc97',
            grid: 'rgba(120, 160, 220, 0.07)',
            text: '#7f92b0'
        };

        async function loadStats() {
            try {
                const [summaryRes, dailyRes] = await Promise.all([
                    fetch(API_BASE + '/api/stats/summary'),
                    fetch(API_BASE + '/api/stats/daily')
                ]);

                const summary = await summaryRes.json();
                const daily   = await dailyRes.json();

                animateNumber('total-clicks', summary.total_clicks || 0);
                animateNumber('total-views',  summary.total_views  || 0);
                animateNumber('unique-users', summary.unique_users || 0);
                animateNumber('total-forms',  summary.total_forms  || 0);

                renderList('top-pages',  summary.top_pages,  'page');
                renderList('top-clicks', summary.top_clicks, 'element');
                renderList('top-inputs', summary.top_inputs, 'element');

                renderChart(daily);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (e) {
                console.error('load error', e);
                document.getElementById('loading').textContent = 'Failed to load data';
            }
        }

        function animateNumber(id, target) {
            const el = document.getElementById(id);
            const duration = 800;
            const start = performance.now();
            function update(now) {
                const p = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - p, 3);
                const current = Math.floor(eased * target);
                el.textContent = current.toLocaleString('en-US');
                if (p < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        function renderList(id, items, nameKey) {
            const c = document.getElementById(id);
            if (!items || items.length === 0) {
                c.innerHTML = '<div class="list-item"><span class="name">No data</span></div>';
                return;
            }
            c.innerHTML = items.map((it, i) => `
                <div class="list-item">
                    <div class="rank">${i + 1}</div>
                    <span class="name">${escapeHtml(it[nameKey] || 'Unknown')}</span>
                    <span class="count">${it.count}</span>
                </div>
            `).join('');
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function renderChart(daily) {
            const ctx = document.getElementById('dailyChart').getContext('2d');

            const labels = daily.daily_views.map(d => {
                const dt = new Date(d.date);
                return dt.toLocaleDateString('en-US', { day: '2-digit', month: 'short' });
            });

            const viewsData  = daily.daily_views.map(d => d.count);
            const clicksData = daily.daily_clicks.map(d => d.count);
            const formsData  = daily.daily_forms.map(d => d.count);

            const gViews = ctx.createLinearGradient(0, 0, 0, 210);
            gViews.addColorStop(0, 'rgba(94, 184, 255, 0.30)');
            gViews.addColorStop(1, 'rgba(94, 184, 255, 0)');

            const gClicks = ctx.createLinearGradient(0, 0, 0, 210);
            gClicks.addColorStop(0, 'rgba(124, 140, 255, 0.30)');
            gClicks.addColorStop(1, 'rgba(124, 140, 255, 0)');

            const gForms = ctx.createLinearGradient(0, 0, 0, 210);
            gForms.addColorStop(0, 'rgba(61, 220, 151, 0.28)');
            gForms.addColorStop(1, 'rgba(61, 220, 151, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Views',
                            data: viewsData,
                            borderColor: COLORS.cyan,
                            backgroundColor: gViews,
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: COLORS.cyan,
                            pointBorderColor: '#070b18',
                            pointBorderWidth: 2,
                            pointRadius: 3, pointHoverRadius: 5
                        },
                        {
                            label: 'Clicks',
                            data: clicksData,
                            borderColor: COLORS.blue,
                            backgroundColor: gClicks,
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: COLORS.blue,
                            pointBorderColor: '#070b18',
                            pointBorderWidth: 2,
                            pointRadius: 3, pointHoverRadius: 5
                        },
                        {
                            label: 'Submissions',
                            data: formsData,
                            borderColor: COLORS.green,
                            backgroundColor: gForms,
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: COLORS.green,
                            pointBorderColor: '#070b18',
                            pointBorderWidth: 2,
                            pointRadius: 3, pointHoverRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: COLORS.text,
                                padding: 14,
                                font: { size: 11.5, weight: '600' },
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(7, 11, 24, 0.95)',
                            borderColor: COLORS.cyan,
                            borderWidth: 1,
                            titleColor: '#fff',
                            bodyColor: COLORS.cyan,
                            padding: 10,
                            cornerRadius: 8
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: COLORS.text, font: { size: 11 }, padding: 6 },
                            grid: { color: COLORS.grid, drawBorder: false }
                        },
                        x: {
                            ticks: { color: COLORS.text, font: { size: 11 }, padding: 6 },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        loadStats();
    })();
    </script>
</body>
</html>
